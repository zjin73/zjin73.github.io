<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · SIC Lab</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#f2f3f4">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | escape }} · SIC Lab">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090f1d'/%3E%3Ctext x='6' y='41' fill='%2361dfed' font-family='Arial' font-weight='bold' font-size='27'%3ESIC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ '/assets/css/researcher.css' | relative_url }}?v=20261111-columns-v6">
</head>
<body {% if page.url == '/cv/' %}class="cv-page"{% endif %}>
<a class="skip" href="#main">Skip to content</a>
<div id="top"></div>
<header class="site-header"><div class="wrap header-inner">
<a class="brand" href="{{ '/' | relative_url }}" aria-label="SIC Lab, home"><span class="brand-text"><span class="brand-title">SIC Lab</span><span class="brand-subtitle">System Identification &amp; Control</span></span></a>
<nav id="navigation" aria-label="Main navigation">
<a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
<a href="{{ '/portfolio/' | relative_url }}" {% if page.url == '/portfolio/' %}aria-current="page"{% endif %}>Projects</a>
<a href="{{ '/publications/' | relative_url }}" {% if page.url == '/publications/' %}aria-current="page"{% endif %}>Publications</a>
<a href="{{ '/blogs/' | relative_url }}" {% if page.url contains '/blogs/' %}aria-current="page"{% endif %}>Blogs</a>
<a href="{{ '/service/' | relative_url }}" {% if page.url == '/service/' %}aria-current="page"{% endif %}>Service</a>
<a href="{{ '/daily/' | relative_url }}" {% if page.url == '/daily/' %}aria-current="page"{% endif %}>Daily</a>
<a href="{{ '/cv/' | relative_url }}" {% if page.url == '/cv/' %}aria-current="page"{% endif %}>CV</a>
</nav></div></header>
<main id="main" class="wrap">{{ content }}</main>
<footer class="wrap footer"><span>© {{ 'now' | date: '%Y' }} Zhiheng Jin</span></footer>
</body>
</html>
