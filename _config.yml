# Personal website configuration.
title: ""
name: "Zhiheng Jin"
description: "Zhiheng Jin — system identification, multi-agent systems, agent + control, and complex systems."
url: "https://zjin73.github.io"
baseurl: ""
repository: "zjin73/zjin73.github.io"
locale: "en-US"
timezone: "Asia/Shanghai"
encoding: "utf-8"
future: true

include:
  - _pages

# Repository instructions and the blog template are not website content.
exclude:
  - README.md
  - instruction.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - _blogs/README.md
  - _blogs/template.md
  - .bundle
  - vendor
  - node_modules
  - local
  - tmp
  - preview
  - preview_render.py

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

collections:
  blogs:
    output: true
    permalink: /blogs/:path/

defaults:
  - scope:
      path: ""
      type: blogs
    values:
      layout: notebook

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
